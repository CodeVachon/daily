# Build and publish the production image for a release.
#
# Publish a GitHub Release tagged vX.Y.Z (e.g. `gh release create v0.1.0
# --generate-notes`) and this checks the code, then pushes
# ghcr.io/codevachon/daily:X.Y.Z (+ sha-…, and X.Y / latest when it is the
# newest stable release). The version is baked
# into the image (APP_VERSION) and shown in Settings → About.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.1.0
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/daily

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # fallow reads git history for hotspots
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run fallow

  image:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version from tag
        id: version
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi

          # Moving tags only move forwards: `latest` follows the newest stable
          # release and `X.Y` the newest patch of its line, so rebuilding an old
          # tag or shipping a hotfix for an old line never downgrades them.
          minor="${version%.*}"
          latest=false
          minor_head=false
          if [[ "$version" != *-* ]]; then
            stable="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
              | sed 's|.*refs/tags/v||' \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; })"
            line="$(grep -E "^${minor//./\\.}\.[0-9]+$" <<< "$stable" || true)"
            newest() { printf '%s\n' "$version" "$@" | sort -V | tail -n 1; }
            # shellcheck disable=SC2086
            if [[ "$(newest $stable)" == "$version" ]]; then latest=true; fi
            # shellcheck disable=SC2086
            if [[ "$(newest $line)" == "$version" ]]; then minor_head=true; fi
          fi

          # From the checked-out tag, not github.sha: on workflow_dispatch that
          # is the head of the dispatching branch.
          {
            echo "version=$version"
            echo "minor=$minor"
            echo "latest=$latest"
            echo "minor_head=$minor_head"
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # X.Y and latest only for stable releases, and only when this is the
          # newest one (see "Version from tag").
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.minor_head }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Daily
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # DigitalOcean droplets
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### ${IMAGE}:${{ steps.version.outputs.version }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
